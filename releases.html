<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Releases | Disco Nights</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><img src="images/logo.png" alt="Disco Nights"></a>
    <button class="menu-toggle" aria-label="Menu">&#9776;</button>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a class="active" href="releases.html">Releases</a>
      <a href="roster.html">Roster</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero small">
      <span class="eyebrow">Catalogue</span>
      <h1 class="page-title">Releases</h1>
    </section>

    <section class="section" style="padding-top: 0;">
      <article class="release-card">
        <img class="cover" src="images/2nite.png" alt="Disconite – 2Nite cover art">
        <div>
          <div class="cat">DN001</div>
          <h2>2Nite</h2>
          <div class="artist">Disconite</div>

          <div class="countdown small" aria-label="Countdown to release">
            <div class="unit"><span class="num" data-unit="days">00</span><span class="lbl">Days</span></div>
            <div class="unit"><span class="num" data-unit="hours">00</span><span class="lbl">Hours</span></div>
            <div class="unit"><span class="num" data-unit="mins">00</span><span class="lbl">Mins</span></div>
            <div class="unit"><span class="num" data-unit="secs">00</span><span class="lbl">Secs</span></div>
          </div>
          <p class="release-date">Out Friday, October 9</p>

          <div class="snippet">
            <span class="snippet-label">Preview</span>
            <audio controls preload="metadata" src="audio/2nite.mp3">Your browser does not support audio playback.</audio>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <img src="images/logo.png" alt="Disco Nights">
    <span>&copy; 2026 Disco Nights. All rights reserved.</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
